[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flightlab"
version = "0.1.0"
description = "Physics-based aircraft flight dynamics, state estimation, and flight-control simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "FlightLab Contributors"}
]
keywords = ["aerospace", "flight dynamics", "6-DOF", "EKF", "MPC", "PID", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "casadi>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
flightlab-validate = "experiments.validate_dynamics:main"

[tool.setuptools.packages.find]
include = ["flightlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
